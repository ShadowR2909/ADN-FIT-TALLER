{% extends 'base.html' %}

{% block title %}Editar Usuario{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>Editar Usuario: {{ usuario_a_editar.username }}</h1>

    <form method="POST">
    {% csrf_token %}
    {{ profile_form.as_p }}

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if usuario_a_editar.is_active %}checked{% endif %}>
        <label class="form-check-label" for="is_active">
            Activo
        </label>
    </div>

    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
    <a href="{% url 'gestion_usuarios' %}" class="btn btn-secondary">Cancelar</a>
</form>

</div>
{% endblock %}
